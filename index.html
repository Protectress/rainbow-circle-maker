<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circular Rainbow Generator</title>
<style>
  :root{
    --ink:#14131A;
    --ground:#1E1C25;
    --raise:#262330;
    --rule:#35313F;
    --parchment:#EAE4D8;
    --muted:#948DA0;
    --gold:#C6A664;

    --display:'Palatino Linotype','Iowan Old Style',Palatino,'Book Antiqua',Georgia,serif;
    --ui:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,sans-serif;
    --mono:'Cascadia Mono',Consolas,'SF Mono',ui-monospace,monospace;
  }

  *{box-sizing:border-box}

  html,body{margin:0;height:100%}
  body{
    background:var(--ink);
    color:var(--parchment);
    font-family:var(--ui);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }

  .shell{
    display:grid;
    grid-template-columns:minmax(0,1fr) 340px;
    gap:28px;
    height:100%;
    padding:24px;
  }

  /* ---------- stage ---------- */

  .stage{
    display:flex;
    flex-direction:column;
    min-width:0;
    gap:16px;
  }

  header{
    display:flex;
    align-items:baseline;
    gap:14px;
    flex-wrap:wrap;
  }
  h1{
    font-family:var(--display);
    font-weight:400;
    font-size:23px;
    letter-spacing:.01em;
    margin:0;
  }
  .sub{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .framewrap{
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .frame{
    aspect-ratio:1;
    height:100%;
    max-width:100%;
    max-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid var(--rule);
    border-radius:3px;
    overflow:hidden;
    position:relative;
  }
  .frame[data-backdrop="checker"]{
    background-color:#2A2733;
    background-image:
      linear-gradient(45deg,#211E29 25%,transparent 25%,transparent 75%,#211E29 75%),
      linear-gradient(45deg,#211E29 25%,transparent 25%,transparent 75%,#211E29 75%);
    background-size:22px 22px;
    background-position:0 0,11px 11px;
  }
  .frame[data-backdrop="white"]{background:#F2F0EB}
  .frame[data-backdrop="black"]{background:#000}
  .frame[data-backdrop="ink"]{background:#14131A}

  canvas#preview{
    display:block;
    max-width:100%;
    max-height:100%;
  }

  .stagefoot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .backdrops{display:flex;align-items:center;gap:9px}
  .backdrops span{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin-right:3px;
  }
  .chip{
    width:22px;height:22px;
    border-radius:50%;
    border:1px solid var(--rule);
    padding:0;
    cursor:pointer;
  }
  .chip[aria-pressed="true"]{
    border-color:var(--gold);
    box-shadow:0 0 0 2px rgba(198,166,100,.22);
  }
  .chip.c-checker{background:repeating-conic-gradient(#3A3644 0 25%,#26232F 0 50%) 0 0/10px 10px}
  .chip.c-white{background:#F2F0EB}
  .chip.c-black{background:#000}
  .chip.c-ink{background:#14131A}

  .readout{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--muted);
  }

  /* ---------- panel ---------- */

  .panel{
    overflow-y:auto;
    padding-right:6px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  .panel::-webkit-scrollbar{width:9px}
  .panel::-webkit-scrollbar-thumb{background:var(--rule);border-radius:9px}

  fieldset{
    border:0;
    border-top:1px solid var(--rule);
    margin:0;
    padding:14px 0 0;
  }
  legend{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.11em;
    text-transform:uppercase;
    color:var(--muted);
    padding:0 10px 0 0;
  }

  .row{margin-bottom:13px}
  .row:last-child{margin-bottom:0}

  .rowhead{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    margin-bottom:5px;
  }
  .rowhead label{cursor:pointer}
  .val{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:18px;
    background:transparent;cursor:pointer;margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:2px;background:var(--rule);border-radius:2px;
  }
  input[type=range]::-moz-range-track{
    height:2px;background:var(--rule);border-radius:2px;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:13px;height:13px;margin-top:-5.5px;
    border-radius:50%;background:var(--parchment);
    border:0;
  }
  input[type=range]::-moz-range-thumb{
    width:13px;height:13px;border:0;
    border-radius:50%;background:var(--parchment);
  }
  input[type=range]:focus-visible::-webkit-slider-thumb{
    box-shadow:0 0 0 3px rgba(198,166,100,.5);
  }
  input[type=range]:focus-visible::-moz-range-thumb{
    box-shadow:0 0 0 3px rgba(198,166,100,.5);
  }
  input[type=range]:disabled{opacity:.32;cursor:default}

  .inline{display:flex;align-items:center;gap:10px;margin-bottom:11px}
  .inline label{flex:1;cursor:pointer}

  input[type=checkbox]{
    appearance:none;-webkit-appearance:none;
    width:15px;height:15px;margin:0;
    border:1px solid var(--rule);border-radius:2px;
    background:var(--raise);cursor:pointer;
    display:grid;place-content:center;
  }
  input[type=checkbox]::after{
    content:'';width:7px;height:7px;border-radius:1px;
    background:var(--gold);transform:scale(0);
  }
  input[type=checkbox]:checked::after{transform:scale(1)}
  input[type=checkbox]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  input[type=color]{
    appearance:none;-webkit-appearance:none;
    width:34px;height:22px;padding:0;
    border:1px solid var(--rule);border-radius:2px;
    background:transparent;cursor:pointer;
  }
  input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
  input[type=color]::-webkit-color-swatch{border:0;border-radius:1px}
  input[type=color]::-moz-color-swatch{border:0;border-radius:1px}
  input[type=color]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  .exp{
    width:100%;
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    background:var(--raise);
    border:1px solid var(--rule);border-radius:2px;
    color:var(--parchment);
    font-family:var(--ui);font-size:13px;
    padding:9px 11px;margin-bottom:7px;
    cursor:pointer;text-align:left;
  }
  .exp:hover{border-color:var(--gold)}
  .exp:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .exp .dim{font-family:var(--mono);font-size:11px;color:var(--muted)}

  .ghost{
    width:100%;
    background:transparent;border:1px solid var(--rule);border-radius:2px;
    color:var(--muted);font-family:var(--ui);font-size:12.5px;
    padding:7px;cursor:pointer;
  }
  .ghost:hover{color:var(--parchment);border-color:var(--muted)}
  .ghost:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  .status{
    font-family:var(--mono);font-size:11px;
    color:var(--muted);min-height:1.4em;margin-top:8px;
  }

  @media (max-width:900px){
    .shell{grid-template-columns:1fr;height:auto;padding:16px}
    .framewrap{flex:none}
    .frame{height:auto;width:100%}
    .panel{overflow:visible;max-height:none}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>

<div class="shell">

  <section class="stage">
    <header>
      <h1>Circular Rainbow Generator</h1>
      <span class="sub" id="ringstat">—</span>
    </header>

    <div class="framewrap">
      <div class="frame" id="frame" data-backdrop="checker">
        <canvas id="preview"></canvas>
      </div>
    </div>

    <div class="stagefoot">
      <div class="backdrops">
        <span>Preview against</span>
        <button class="chip c-checker" data-bd="checker" aria-pressed="true" title="Transparent"></button>
        <button class="chip c-white"   data-bd="white"   aria-pressed="false" title="White"></button>
        <button class="chip c-black"   data-bd="black"   aria-pressed="false" title="Black"></button>
        <button class="chip c-ink"     data-bd="ink"     aria-pressed="false" title="Dark"></button>
      </div>
      <div class="readout">Exports as a square PNG</div>
    </div>
  </section>

  <aside class="panel">

    <fieldset>
      <legend>Ring</legend>

      <div class="row">
        <div class="rowhead"><label for="diameter">Diameter</label><span class="val" id="v-diameter"></span></div>
        <input type="range" id="diameter" min="10" max="100" step="0.5" value="74">
      </div>

      <div class="row">
        <div class="rowhead"><label for="width">Band width</label><span class="val" id="v-width"></span></div>
        <input type="range" id="width" min="0.5" max="50" step="0.25" value="7.4">
      </div>

      <div class="row">
        <div class="rowhead"><label for="blur">Blur</label><span class="val" id="v-blur"></span></div>
        <input type="range" id="blur" min="0" max="6" step="0.05" value="0.28">
      </div>
    </fieldset>

    <fieldset>
      <legend>Color</legend>

      <div class="row">
        <div class="rowhead"><label for="sat">Saturation</label><span class="val" id="v-sat"></span></div>
        <input type="range" id="sat" min="0" max="100" step="1" value="100">
      </div>

      <div class="inline">
        <label for="tintcolor">Tint</label>
        <input type="color" id="tintcolor" value="#ffffff">
      </div>
      <div class="row">
        <div class="rowhead"><label for="tint">Tint strength</label><span class="val" id="v-tint"></span></div>
        <input type="range" id="tint" min="0" max="100" step="1" value="0">
      </div>
    </fieldset>

    <fieldset>
      <legend>Inner glow</legend>
      <div class="inline">
        <input type="checkbox" id="inneron">
        <label for="inneron">Fill toward center</label>
        <input type="color" id="innercolor" value="#ffffff">
      </div>
      <div class="row">
        <div class="rowhead"><label for="innerwidth">Reach</label><span class="val" id="v-innerwidth"></span></div>
        <input type="range" id="innerwidth" min="0" max="100" step="1" value="100" disabled>
      </div>
      <div class="readout" style="margin-top:-4px">100% floods the whole interior</div>
    </fieldset>

    <fieldset>
      <legend>Outer glow</legend>
      <div class="inline">
        <input type="checkbox" id="outeron" checked>
        <label for="outeron">Bleed outward</label>
        <input type="color" id="outercolor" value="#ffffff">
      </div>
      <div class="row">
        <div class="rowhead"><label for="outerwidth">Reach</label><span class="val" id="v-outerwidth"></span></div>
        <input type="range" id="outerwidth" min="0" max="100" step="1" value="100">
      </div>
      <div class="readout" style="margin-top:-4px">100% floods everything outside the band</div>
    </fieldset>

    <fieldset>
      <legend>Export</legend>
      <button class="exp" data-size="1920"><span>Export</span><span class="dim">1920 × 1920</span></button>
      <button class="exp" data-size="3840"><span>Export</span><span class="dim">3840 × 3840</span></button>
      <button class="exp" data-size="6000"><span>Export</span><span class="dim">6000 × 6000</span></button>
      <div class="status" id="status"></div>
      <button class="ghost" id="reset">Reset to defaults</button>
    </fieldset>

  </aside>
</div>

<script>
(function(){
  'use strict';

  var FULL = [
    [255,0,0],[255,127,0],[255,255,0],[0,255,0],[0,0,255],[75,0,130],[148,0,211]
  ];
  var SOFT = [
    [255,178,178],[255,214,178],[255,255,178],[178,255,178],[178,178,255],[201,178,255],[229,178,255]
  ];

  var el = function(id){ return document.getElementById(id); };
  var frame   = el('frame');
  var preview = el('preview');
  var status  = el('status');
  var ringstat= el('ringstat');

  var DEFAULTS = {
    diameter:74, width:7.4, blur:0.28,
    sat:100, tintcolor:'#ffffff', tint:0,
    inneron:false, innercolor:'#ffffff', innerwidth:100,
    outeron:true,  outercolor:'#ffffff', outerwidth:100
  };

  /* ---------- color helpers ---------- */

  function hexToRgb(h){
    return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  }
  function lerp3(a,b,t){
    return [ a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t ];
  }
  function rgba(c,a){
    return 'rgba('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+','+a+')';
  }

  // Band colour at index i, blended between soft and full by saturation.
  function band(i, sat){
    return lerp3(SOFT[i], FULL[i], sat);
  }

  // pos 0 = outer edge (red) -> 1 = inner edge (violet).
  // Interpolates across adjacent hues, so the seven named colours are
  // waypoints rather than discrete bands.
  function spectrum(pos, sat){
    var f = pos*6;
    var i0 = Math.min(5, Math.floor(f));
    return lerp3(band(i0,sat), band(i0+1,sat), f-i0);
  }

  // Applied once. In the tkinter version apply_tint ran twice per colour,
  // so tint strength compounded; here 100 means fully the tint colour.
  function tinted(c, tintRgb, strength){
    if (strength <= 0) return c;
    return lerp3(c, tintRgb, strength/100);
  }

  /* ---------- parameters ---------- */

  function readParams(){
    return {
      diameter:   parseFloat(el('diameter').value),
      width:      parseFloat(el('width').value),
      blur:       parseFloat(el('blur').value),
      sat:        parseFloat(el('sat').value)/100,
      tintRgb:    hexToRgb(el('tintcolor').value),
      tint:       parseFloat(el('tint').value),
      innerOn:    el('inneron').checked,
      innerRgb:   hexToRgb(el('innercolor').value),
      innerReach: parseFloat(el('innerwidth').value)/100,
      outerOn:    el('outeron').checked,
      outerRgb:   hexToRgb(el('outercolor').value),
      outerReach: parseFloat(el('outerwidth').value)/100
    };
  }

  /* ---------- geometry ---------- */

  // Everything the drawing needs, in pixels, for a canvas of a given size.
  //
  // Both glow sliders run in two phases. Over the first half the fade's far
  // end travels outward (or inward) until it spans the whole available run.
  // Over the second half a solid plateau grows in behind it. So 50% is a
  // full-length gradient and 100% is flat colour edge to edge.
  function geometry(size, p){
    var c = size/2;
    var outerR = size * p.diameter / 200;
    var ringW  = Math.min(size * p.width / 100, outerR);
    var blurPx = size * p.blur / 100;
    var k = 1;

    // Keep the band's blurred outer edge inside the frame. A Gaussian is
    // visibly gone by about 2.5 sigma. Glow reach is deliberately excluded
    // from this: it is allowed to leave the frame, so it must never move
    // the band. Only large diameters or heavy blur trigger any scaling.
    var need = outerR + blurPx * 2.5;
    if (need > c && need > 0){
      k = c / need;
      outerR *= k;
      ringW  *= k;
      blurPx *= k;
    }

    var innerR = Math.max(0, outerR - ringW);

    // The far corner is the last pixel any glow has to cover. A little margin
    // past it guarantees the corners are inside the fill, not on its boundary.
    var corner = c * Math.SQRT2 * 1.06;

    var oT   = (p.outerOn ? p.outerReach : 0);
    var oRun = Math.max(0, corner - outerR);
    var maxR  = outerR + oRun * Math.min(1, oT * 2);
    var oPlat = outerR + oRun * Math.max(0, oT * 2 - 1);

    var iT = (p.innerOn ? p.innerReach : 0);
    var iFade = innerR * (1 - Math.min(1, iT * 2));   // transparent inside this
    var iPlat = innerR * (1 - Math.max(0, iT * 2 - 1)); // solid outside this

    return {
      c:c, outerR:outerR, ringW:ringW, innerR:innerR,
      tIn: outerR > 0 ? innerR/outerR : 0,
      maxR:maxR, oPlat:oPlat, iFade:iFade, iPlat:iPlat,
      blurPx:blurPx, k:k
    };
  }

  /* ---------- render ---------- */

  function draw(size, p){
    var G = geometry(size, p);
    var blurPx = G.blurPx;

    // Render onto a padded canvas and crop back. Without the margin the blur
    // samples transparency just outside the frame and feathers the border —
    // which at full outer flood looks exactly like the image being cut off.
    var pad = blurPx > 0.05
      ? Math.min(Math.ceil(blurPx * 3), Math.ceil(size * 0.06))
      : 0;
    var W = size + pad * 2;

    var base = document.createElement('canvas');
    base.width = base.height = W;
    var ctx = base.getContext('2d');

    var c = W / 2;
    var outerR = G.outerR, innerR = G.innerR, tIn = G.tIn;

    function cut(r){
      ctx.fillStyle = '#000';
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath(); ctx.arc(c,c,r,0,Math.PI*2); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }

    // --- outer glow, underneath everything ---
    // Painted as a full disc, then the interior is cut away at outerR.
    if (p.outerOn && p.outerReach > 0 && outerR > 0){
      var maxR = G.maxR;
      var t0 = outerR / maxR;
      var tP = Math.min(0.9995, Math.max(t0, G.oPlat / maxR));
      var og = ctx.createRadialGradient(c,c,0,c,c,maxR);
      og.addColorStop(0,  rgba(p.outerRgb,1));
      og.addColorStop(t0, rgba(p.outerRgb,1));
      og.addColorStop(tP, rgba(p.outerRgb,1));
      og.addColorStop(1,  rgba(p.outerRgb,0));
      ctx.fillStyle = og;
      ctx.beginPath(); ctx.arc(c,c,maxR,0,Math.PI*2); ctx.fill();
      cut(outerR);
    }

    // --- the rainbow band ---
    if (outerR > 0){
      var rg = ctx.createRadialGradient(c,c,0,c,c,outerR);
      var stops = [];
      var i, pos, t, col;

      var N = 64;
      for (i=0;i<=N;i++){
        pos = i/N;
        t = 1 - pos*(1-tIn);
        col = tinted(spectrum(pos,p.sat), p.tintRgb, p.tint);
        stops.push([t, rgba(col,1)]);
      }

      stops.sort(function(a,b){ return a[0]-b[0]; });

      // hard cut on the inside edge of the band
      if (tIn > 0.002){
        rg.addColorStop(0, 'rgba(0,0,0,0)');
        rg.addColorStop(tIn - 0.001, 'rgba(0,0,0,0)');
      }
      for (i=0;i<stops.length;i++){
        rg.addColorStop(Math.min(1, Math.max(0, stops[i][0])), stops[i][1]);
      }

      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(c,c,outerR,0,Math.PI*2); ctx.fill();
    }

    // --- clear the centre ---
    // The band's innermost stop fills the whole disc, and the outer glow
    // sat under it, so the interior has to be cut before anything else goes in.
    // Note the explicit opaque fillStyle inside cut(): destination-out erases
    // in proportion to source alpha, so cutting with the band's own gradient
    // (transparent across the interior) would erase nothing at all.
    if (innerR > 0) cut(innerR);

    // --- inner glow ---
    if (p.innerOn && p.innerReach > 0 && innerR > 0){
      var tF = Math.max(0, Math.min(0.999, G.iFade / innerR));
      var tI = Math.min(1, Math.max(tF + 0.0005, G.iPlat / innerR));
      var ig = ctx.createRadialGradient(c,c,0,c,c,innerR);
      ig.addColorStop(0, rgba(p.innerRgb,0));
      if (tF > 0.0005) ig.addColorStop(tF, rgba(p.innerRgb,0));
      ig.addColorStop(tI, rgba(p.innerRgb,1));
      ig.addColorStop(1,  rgba(p.innerRgb,1));
      ctx.fillStyle = ig;
      ctx.beginPath(); ctx.arc(c,c,innerR,0,Math.PI*2); ctx.fill();
    }

    // --- blur, cropping the padding back off ---
    var out = document.createElement('canvas');
    out.width = out.height = size;
    var octx = out.getContext('2d');
    if (blurPx > 0.05) octx.filter = 'blur(' + blurPx + 'px)';
    octx.drawImage(base, -pad, -pad);
    return out;
  }

  /* ---------- preview ---------- */

  var pending = false;

  function schedule(){
    if (pending) return;
    pending = true;
    requestAnimationFrame(function(){ pending = false; renderPreview(); });
  }

  function renderPreview(){
    var p = readParams();
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var rect = frame.getBoundingClientRect();
    var css = Math.max(200, Math.floor(Math.min(rect.width, rect.height) - 2));
    var size = Math.round(css * dpr);

    preview.style.width = css + 'px';
    preview.style.height = css + 'px';
    preview.width = size;
    preview.height = size;

    var img = draw(size, p);
    var ctx = preview.getContext('2d');
    ctx.clearRect(0,0,size,size);
    ctx.drawImage(img, 0, 0);

    syncLabels(p);
  }

  function syncLabels(p){
    el('v-diameter').textContent   = p.diameter.toFixed(1) + '% of frame';
    el('v-width').textContent      = p.width.toFixed(2) + '% of frame';
    el('v-blur').textContent       = p.blur.toFixed(2) + '% of frame';
    el('v-sat').textContent        = Math.round(p.sat*100) + '%';
    el('v-tint').textContent       = p.tint + '%';
    el('v-innerwidth').textContent = Math.round(p.innerReach*100) + '%';
    el('v-outerwidth').textContent = Math.round(p.outerReach*100) + '%';

    // What these settings actually produce at full export size — after
    // fitting, which is the number that matters when the ring has to sit
    // on top of something else.
    var G6 = geometry(6000, p);
    ringstat.textContent = Math.round(G6.outerR*2) + 'px ring · ' +
                           Math.round(G6.ringW) + 'px band at 6000';
  }

  /* ---------- export ---------- */

  function exportAt(size){
    status.textContent = 'Rendering ' + size + ' × ' + size + '…';
    setTimeout(function(){
      var img = draw(size, readParams());
      img.toBlob(function(blob){
        if (!blob){
          status.textContent = 'Export failed — try a smaller size.';
          return;
        }
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'rainbow-' + size + 'x' + size + '.png';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
        status.textContent = 'Exported rainbow-' + size + 'x' + size + '.png';
      }, 'image/png');
    }, 20);
  }

  /* ---------- wiring ---------- */

  var inputs = ['diameter','width','blur','sat','tint','tintcolor',
                'inneron','innercolor','innerwidth',
                'outeron','outercolor','outerwidth'];

  inputs.forEach(function(id){
    el(id).addEventListener('input', schedule);
    el(id).addEventListener('change', schedule);
  });

  el('inneron').addEventListener('change', function(){
    el('innerwidth').disabled = !this.checked;
  });
  el('outeron').addEventListener('change', function(){
    el('outerwidth').disabled = !this.checked;
  });

  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(b){
    b.addEventListener('click', function(){
      frame.dataset.backdrop = b.dataset.bd;
      Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(o){
        o.setAttribute('aria-pressed', String(o === b));
      });
    });
  });

  Array.prototype.forEach.call(document.querySelectorAll('.exp'), function(b){
    b.addEventListener('click', function(){ exportAt(parseInt(b.dataset.size,10)); });
  });

  el('reset').addEventListener('click', function(){
    Object.keys(DEFAULTS).forEach(function(k){
      var node = el(k);
      if (node.type === 'checkbox') node.checked = DEFAULTS[k];
      else node.value = DEFAULTS[k];
    });
    el('innerwidth').disabled = !DEFAULTS.inneron;
    el('outerwidth').disabled = !DEFAULTS.outeron;
    status.textContent = 'Reset.';
    schedule();
  });

  window.addEventListener('resize', schedule);
  renderPreview();
})();
</script>
</body>
</html>
